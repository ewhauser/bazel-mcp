name: Scheduled fuzzing
on:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 6"
permissions: {}
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fuzz-targets:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { persist-credentials: false }
      - name: Discover fuzz targets
        id: targets
        shell: bash
        run: |
          matrix="$(
            cargo metadata --no-deps --format-version 1 \
              --manifest-path fuzz/Cargo.toml |
              jq -c '[.packages[].targets[] | select(.kind == ["bin"]) | .name]'
          )"
          test "$matrix" != "[]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  fuzz:
    needs: fuzz-targets
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { persist-credentials: false }
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz selected target
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: cd fuzz && cargo +nightly fuzz run "$FUZZ_TARGET" -- -max_total_time=300
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
